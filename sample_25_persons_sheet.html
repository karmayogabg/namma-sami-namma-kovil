<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSNK - 25 Persons / Page Single Table Caller Sheet Sample</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        @page { size: A4 portrait; margin: 8mm; }
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans Tamil', -apple-system, sans-serif; background: #e2e8f0; color: #0f172a; margin: 0; padding: 15px; font-size: 11px; }

        .sheet-container { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 10mm 12mm; border: 1px solid #cbd5e1; box-shadow: 0 6px 16px rgba(0,0,0,0.12); position: relative; }

        /* Dual Tracking Header */
        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 10px; }
        .sheet-title h2 { margin: 0; font-size: 1.15rem; font-family: 'Outfit', sans-serif; font-weight: 700; color: #0f172a; }
        .sheet-title p { margin: 3px 0 0 0; font-size: 0.78rem; color: #475569; font-weight: 600; }
        .header-code-badge { display: inline-block; background: #0f172a; color: #6ee7b7; font-family: monospace; font-weight: 700; font-size: 0.85rem; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }

        .barcode-container { text-align: right; }
        .barcode-img { height: 32px; }

        /* Single Table Layout */
        table.records-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
        table.records-table th { background: #0f172a; color: #fff; border: 1.5px solid #0f172a; padding: 6px 8px; font-size: 0.78rem; text-align: left; }
        table.records-table td { border: 1.5px solid #334155; padding: 5px 8px; vertical-align: middle; height: 38px; font-size: 0.88rem; }

        .member-idx { font-weight: 700; font-size: 0.8rem; background: #0f172a; color: #fff; padding: 2px 6px; border-radius: 3px; text-align: center; display: inline-block; min-width: 28px; }
        .member-name { font-weight: 700; color: #0f172a; font-size: 0.92rem; }
        .member-phone { font-size: 0.82rem; color: #1e293b; font-family: monospace; font-weight: 600; }

        /* OMR Rating Bubbles */
        .q-bubbles-group { display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
        .q-sub-box { display: flex; align-items: center; gap: 3px; background: #f8fafc; padding: 3px 6px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .q-lbl { font-size: 0.72rem; font-weight: 700; color: #0f172a; margin-right: 2px; }
        .bubble { display: inline-block; width: 15px; height: 15px; border: 1.5px solid #0f172a; border-radius: 50%; text-align: center; line-height: 14px; font-size: 0.68rem; font-weight: 700; color: #0f172a; background: #fff; }
        .bubble.filled { background: #0f172a; color: #fff; border-color: #0f172a; }
    </style>
</head>
<body>

    <div class="sheet-container">
        <!-- Dual Tracking Header -->
        <div class="sheet-header">
            <div class="sheet-title">
                <h2>நம்ம சாமி நம்ம கோவில் - உறுப்பினர்கள் தகவல்கள் & மதிப்பீட்டுத் தாள்</h2>
                <p>Persons #1 to #25 • Batch #001 • Page 1 of 20 (Total 25 Persons/Page Layout)</p>
                <div class="header-code-badge">CODE: NSNK-B001-P01</div>
            </div>
            <div class="barcode-container">
                <svg class="barcode-img" id="barcode-NSNK-B001-P01"></svg>
            </div>
        </div>

        <!-- Single Table (25 Persons) -->
        <table class="records-table">
            <thead>
                <tr>
                    <th style="width: 40px; text-align: center;">#</th>
                    <th style="width: 220px;">பெயர் (Tamil Name)</th>
                    <th style="width: 140px;">தொலைபேசி (Phone Number)</th>
                    <th style="text-align: right; padding-right: 15px;">கேள்விகள் Q1, Q2, Q3 மதிப்பீடு (OMR Rating Bubbles)</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        // Statically Embedded 25 Sample Persons Dataset
        const sampleDataset = [
            {"name":"ராம்குமார்","mobile":"7010853258"},
            {"name":"சிவகோகுல்","mobile":"9363786428"},
            {"name":"சிவகோகுல்","mobile":"9363758615"},
            {"name":"பத்மா","mobile":"7358064179"},
            {"name":"தாமோதரன்","mobile":"6380506458"},
            {"name":"ராம்குமார்","mobile":"7010853258"},
            {"name":"மணிகண்டன்","mobile":"9445560803"},
            {"name":"முரளிதரன்","mobile":"9943984477"},
            {"name":"சிவபாலன்","mobile":"7358064179"},
            {"name":"ஜவஹர் பாபு","mobile":"9994558334"},
            {"name":"இராஜகோபால்","mobile":"9443693114"},
            {"name":"கிருஷ்ணன்","mobile":"9360882000"},
            {"name":"ராஜேஷ் குமார்","mobile":"8668090549"},
            {"name":"மாயகிருஷ்ணன்","mobile":"8940842836"},
            {"name":"கார்த்திக்","mobile":"9597107220"},
            {"name":"ராதிகா","mobile":"9486090618"},
            {"name":"கலைமணி","mobile":"8190835670"},
            {"name":"முரளி","mobile":"9543661785"},
            {"name":"ராமஜெயம்","mobile":"9003700575"},
            {"name":"ராமேஸ்வரன்","mobile":"8248482472"},
            {"name":"ஜவஹர் பாபு","mobile":"9994558334"},
            {"name":"ஜெய்சங்கர்","mobile":"7806851354"},
            {"name":"சந்தோஷ்","mobile":"9789345210"},
            {"name":"அன்பரசன்","mobile":"9443128901"},
            {"name":"சுரேஷ்","mobile":"9842156789"}
        ];

        // Sample Marked Answers (Rows 1 to 5 show realistic pen shading)
        const markedSampleAnswers = {
            0: {q1:'A', q2:'A', q3:'B'},
            1: {q1:'A', q2:'B', q3:'A'},
            2: {q1:'B', q2:'B', q3:'C'},
            3: {q1:'A', q2:'A', q3:'A'},
            4: {q1:'C', q2:'C', q3:'B'}
        };

        function renderRows() {
            let html = '';
            sampleDataset.forEach((item, i) => {
                const globalNo = i + 1;
                const mark = markedSampleAnswers[i];

                const q1_A = mark && mark.q1 === 'A' ? 'filled' : '';
                const q1_B = mark && mark.q1 === 'B' ? 'filled' : '';
                const q1_C = mark && mark.q1 === 'C' ? 'filled' : '';

                const q2_A = mark && mark.q2 === 'A' ? 'filled' : '';
                const q2_B = mark && mark.q2 === 'B' ? 'filled' : '';
                const q2_C = mark && mark.q2 === 'C' ? 'filled' : '';

                const q3_A = mark && mark.q3 === 'A' ? 'filled' : '';
                const q3_B = mark && mark.q3 === 'B' ? 'filled' : '';
                const q3_C = mark && mark.q3 === 'C' ? 'filled' : '';

                html += `
                    <tr>
                        <td style="text-align:center;"><span class="member-idx">#${globalNo}</span></td>
                        <td><span class="member-name">${item.name}</span></td>
                        <td><span class="member-phone">📞 ${item.mobile}</span></td>
                        <td>
                            <div class="q-bubbles-group">
                                <div class="q-sub-box"><span class="q-lbl">Q1:</span><span class="bubble ${q1_A}">A</span><span class="bubble ${q1_B}">B</span><span class="bubble ${q1_C}">C</span></div>
                                <div class="q-sub-box"><span class="q-lbl">Q2:</span><span class="bubble ${q2_A}">A</span><span class="bubble ${q2_B}">B</span><span class="bubble ${q2_C}">C</span></div>
                                <div class="q-sub-box"><span class="q-lbl">Q3:</span><span class="bubble ${q3_A}">A</span><span class="bubble ${q3_B}">B</span><span class="bubble ${q3_C}">C</span></div>
                            </div>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('table-body').innerHTML = html;
        }

        renderRows();

        // Render Barcode
        try {
            JsBarcode("#barcode-NSNK-B001-P01", "NSNK-B001-P01", {
                format: "CODE128",
                height: 28,
                displayValue: false,
                margin: 0
            });
        } catch(e) {}
    </script>
</body>
</html>
